# Esegue Plugin Check (lo stesso strumento usato dalla revisione di wordpress.org) a ogni push e pull request.
name: Plugin Check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          exclude-directories: ".github,.wordpress-org"
          exclude-files: ".gitattributes,.gitignore,.distignore,README.md"
