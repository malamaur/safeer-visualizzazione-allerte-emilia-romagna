# Aggiorna su wordpress.org solo readme.txt e immagini (.wordpress-org/) senza rilasciare una nuova versione.
name: Aggiorna readme e immagini su WordPress.org

on:
  push:
    branches:
      - main
    paths:
      - "readme.txt"
      - ".wordpress-org/**"

env:
  SLUG: safeer-visualizzazione-allerte-emilia-romagna

jobs:
  assets:
    name: Aggiorna readme e asset
    runs-on: ubuntu-latest
    steps:
      # Finché la prima versione non è pubblicata (trunk vuoto) non c'è nulla da aggiornare:
      # la prima pubblicazione la fa il workflow "Deploy su WordPress.org".
      - uses: actions/checkout@v5
      # Se il readme indica una versione non ancora pubblicata (Stable tag nuovo),
      # readme e immagini li pubblica il workflow "Deploy su WordPress.org" con la Release.
      - name: Controlla che la versione del readme sia già pubblicata
        id: published
        run: |
          VERSION=$(grep -i '^Stable tag:' readme.txt | head -1 | sed 's/^[^:]*:[[:space:]]*//' | tr -d '\r[:space:]')
          if curl -sfI "https://plugins.svn.wordpress.org/${SLUG}/tags/${VERSION}/readme.txt" > /dev/null; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::La versione ${VERSION} non è ancora su wordpress.org: aggiornamento saltato, ci pensa il deploy della Release."
          fi
      - name: Aggiorna su WordPress.org
        if: steps.published.outputs.ok == 'true'
        uses: 10up/action-wordpress-plugin-asset-update@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          IGNORE_OTHER_FILES: true
