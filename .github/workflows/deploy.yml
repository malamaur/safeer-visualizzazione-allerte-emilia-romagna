# Pubblica una nuova versione su wordpress.org quando si crea un tag (es. 2.3.1).
# Richiede i secret SVN_USERNAME e SVN_PASSWORD (Settings > Secrets and variables > Actions).
name: Deploy su WordPress.org

on:
  push:
    tags:
      - "*"

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy su WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: safeer-visualizzazione-allerte-emilia-romagna
